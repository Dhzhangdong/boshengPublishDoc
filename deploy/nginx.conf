server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    location ~ \.pdf$ {
        add_header X-Robots-Tag noindex always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
